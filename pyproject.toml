[project]
name = "dbc-influxdb"
version = "0.15.0"
description = "Database communication with InfluxDB v2."
authors = [{ name = "Lukas Hörtnagl", email = "holukas@ethz.ch" }]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "pyyaml>=6.0.1",
    "pandas>=2.1.0",
    "influxdb-client>=1.37.0",
    "pytz>=2024.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=5.2",
    "twine>=4.0.1",
    "jupyterlab>=4.0.6",
    "matplotlib>=3.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dbc_influxdb"]
